# ATS Research — Example Configuration
# DISCLAIMER: NOT FINANCIAL ADVICE — EDUCATIONAL USE ONLY

data:
  path: data/demo/sample.csv
  freq: "1D"
  tz: "UTC"

strategy:
  name: sma_crossover
  params:
    fast: 20
    slow: 50
    atr_stop: 2.0
    tp_mult: 3.0

risk:
  max_pos_pct: 0.10            # Max 10% of equity per position
  per_trade_risk_pct: 0.01     # Max 1% equity risk per trade
  daily_loss_limit_pct: 0.05   # Halt trading if daily loss > 5%
  vol_target_pct: 0.10         # Target 10% annualized vol

costs:
  slippage_bps: 5.0            # 5 basis points slippage
  commission_per_share: 0.005  # $0.005 per share
  commission_pct: 0.0          # No percentage commission

simulation:
  seed: 42
  liquidity_cap_pct_adv: 0.02  # Max 2% of avg daily volume

output:
  dir: runs
  save_plots: true
